{% extends "gameplay/base.html" %}
{% load static %}

{% block container %}
<div style="padding: 10px 20px;">

    <style>
        #campus-map-wrapper {
            position: relative;
            width: 100%;
        }
        #campus-map-container {
            width: 100%;
            height: 90vh;
            background: linear-gradient(180deg, #e8f4f8 0%, #dff0f7 100%);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }
        [data-theme="dark"] #campus-map-container {
            background: linear-gradient(180deg, #1a2332 0%, #141c28 100%);
        }
        .map-header {
            text-align: center;
            margin-bottom: 8px;
        }
        .map-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary, #1a2b3c);
            margin-bottom: 2px;
        }
        .map-header p {
            color: var(--text-secondary, #7b8fa0);
            font-size: 0.82rem;
            margin: 0;
        }
        .map-live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f0faf5;
            border: 1px solid #c6f0d9;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2d8a5e;
            margin-bottom: 8px;
        }
        .map-live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
        .map-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }
        .map-controls button {
            width: 36px;
            height: 36px;
            border: 1px solid #d1dce5;
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            font-size: 1.1rem;
            color: #4a6275;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            backdrop-filter: blur(8px);
        }
        .map-controls button:hover {
            background: #ffffff;
            border-color: #a0b8ca;
            color: #1a2b3c;
        }
    </style>

    <div class="map-header">
        <h2>Campus Map</h2>
        <p>Explore the 3D campus. The taller the building, the more points the department has.</p>
    </div>

    <div id="campus-map-wrapper">
        <span class="map-live-badge" style="position: absolute; top: 16px; left: 16px; z-index: 10; margin: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">{{ departments|length }} Department{{ departments|length|pluralize }} Live</span>
        <div id="campus-map-container">
            <!-- Three.js Canvas will be appended here -->
        </div>
        <div class="map-controls">
            <button id="zoom-in-btn" title="Zoom In">+</button>
            <button id="zoom-out-btn" title="Zoom Out">−</button>
            <button id="reset-view-btn" title="Reset View">↻</button>
        </div>
    </div>
</div>

<!-- Include Three.js via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('campus-map-container');
        
        // Setup the Scene
        const scene = new THREE.Scene();
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        scene.background = new THREE.Color(isDark ? 0x1a2332 : 0xe8f4f8);

        // Setup Camera
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 1, 1000);
        camera.position.set(70, 90, 130);

        // Setup Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Enable OrbitControls (zoom, spin, pan)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera from dropping below ground
        controls.minDistance = 40;
        controls.maxDistance = 250;
        controls.target.set(50, 0, 50);

        // Zoom controls
        document.getElementById('zoom-in-btn').addEventListener('click', function() {
            camera.position.lerp(controls.target, 0.15);
        });
        document.getElementById('zoom-out-btn').addEventListener('click', function() {
            const dir = camera.position.clone().sub(controls.target).normalize();
            camera.position.add(dir.multiplyScalar(15));
        });
        document.getElementById('reset-view-btn').addEventListener('click', function() {
            camera.position.set(70, 90, 130);
            controls.target.set(50, 0, 50);
            controls.update();
        });

        // Lighting — softer, more diffused
        const ambientLight = new THREE.AmbientLight(0xffffff, isDark ? 0.4 : 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, isDark ? 0.4 : 0.6);
        dirLight.position.set(80, 160, 80);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.top = 120;
        dirLight.shadow.camera.bottom = -120;
        dirLight.shadow.camera.left = -120;
        dirLight.shadow.camera.right = 120;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(isDark ? 0x1a2332 : 0xe8f4f8, 0.3);
        fillLight.position.set(-50, 80, -50);
        scene.add(fillLight);

        // Ground — flat light surface with grid
        const groundSize = 200;
        const planeGeo = new THREE.PlaneGeometry(groundSize, groundSize);
        const planeMat = new THREE.MeshPhongMaterial({
            color: isDark ? 0x1e2a3a : 0xd8eff7,
            shininess: 10,
            transparent: true,
            opacity: 0.7
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        plane.position.set(50, -0.1, 50);
        scene.add(plane);

        // Grid overlay
        const gridHelper = new THREE.GridHelper(groundSize, 30,
            isDark ? 0x2a3a4e : 0xb0dae8,
            isDark ? 0x1e2d3d : 0xc8e6f0
        );
        gridHelper.position.set(50, 0, 50);
        gridHelper.material.opacity = isDark ? 0.35 : 0.5;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // Listen for dark mode toggle to update Three.js scene
        document.querySelectorAll('.theme-toggle').forEach(btn => {
            btn.addEventListener('click', function() {
                setTimeout(function() {
                    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
                    scene.background = new THREE.Color(dark ? 0x1a2332 : 0xe8f4f8);
                    planeMat.color.set(dark ? 0x1e2a3a : 0xd8eff7);
                    ambientLight.intensity = dark ? 0.4 : 0.75;
                    dirLight.intensity = dark ? 0.4 : 0.6;
                    gridHelper.material.opacity = dark ? 0.35 : 0.5;
                }, 50);
            });
        });

        // Dynamic Department Data passed from Django View
        const departments = [
            {% for d in departments %}
            {
                id: {{ d.id }},
                name: "{{ d.name|escapejs }}",
                points: {{ d.total_points|default:0 }},
                height: {{ d.building_height|default:30 }},
                color: "{{ d.color|default:'#06b6d4' }}",
                x: {{ d.pos_left|default:0 }},
                z: {{ d.pos_top|default:0 }},
                is_top: {% if d.is_top %}true{% else %}false{% endif %}
            },
            {% endfor %}
        ];

        // ── Raycasting for building click navigation ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const buildingGroups = [];  // all department groups for raycasting
        let pointerDownPos = null;
        let pointerDownTime = 0;

        // Helper: find the department ID from any hit mesh by walking up to its group
        function getDeptIdFromHit(object) {
            let current = object;
            while (current) {
                if (current.userData && current.userData.deptId) {
                    return current.userData.deptId;
                }
                current = current.parent;
            }
            return null;
        }

        // Create flat layered buildings for each department
        departments.forEach(dept => {
            const buildingHeight = dept.height / 3;
            const layers = Math.max(2, Math.round(buildingHeight / 4));
            const layerHeight = buildingHeight / layers;
            const baseWidth = 14;
            const baseDepth = 14;
            const deptColor = new THREE.Color(dept.color);

            const group = new THREE.Group();
            group.userData = { deptId: dept.id, deptName: dept.name };

            for (let i = 0; i < layers; i++) {
                const shrink = 1 - (i * 0.04);
                const w = baseWidth * shrink;
                const d = baseDepth * shrink;
                const h = layerHeight;

                const geo = new THREE.BoxGeometry(w, h, d);

                // Gradient: darker at bottom, lighter at top
                const t = i / (layers - 1 || 1);
                const layerColor = deptColor.clone();
                layerColor.lerp(new THREE.Color(0xffffff), t * 0.35);

                const mat = new THREE.MeshPhongMaterial({
                    color: layerColor,
                    shininess: 30,
                    transparent: true,
                    opacity: 0.92,
                    emissive: dept.is_top ? deptColor : new THREE.Color(0x000000),
                    emissiveIntensity: dept.is_top ? 0.15 : 0
                });

                const box = new THREE.Mesh(geo, mat);
                box.position.y = (i * layerHeight) + (layerHeight / 2) + 0.5;
                box.castShadow = true;
                box.receiveShadow = true;
                group.add(box);

                // Thin separator line between layers
                if (i > 0) {
                    const lineGeo = new THREE.BoxGeometry(w + 0.5, 0.3, d + 0.5);
                    const lineMat = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.5
                    });
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.position.y = i * layerHeight + 0.5;
                    group.add(line);
                }
            }

            // Accent stripe on top
            const topY = layers * layerHeight + 0.5;
            const accentGeo = new THREE.BoxGeometry(baseWidth * 0.7, 0.6, baseDepth * 0.7);
            const accentMat = new THREE.MeshPhongMaterial({
                color: deptColor,
                shininess: 60
            });
            const accent = new THREE.Mesh(accentGeo, accentMat);
            accent.position.y = topY + 0.3;
            accent.castShadow = true;
            group.add(accent);

            group.position.set(dept.x, 0, dept.z);
            scene.add(group);
            buildingGroups.push(group);

            // Floating label sprite
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 140;
            const ctx = canvas.getContext('2d');

            // Draw rounded label background with subtle shadow
            ctx.shadowColor = 'rgba(0,0,0,0.12)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
            ctx.beginPath();
            ctx.roundRect(30, 10, 452, 120, 16);
            ctx.fill();

            // Left accent bar
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = dept.color;
            ctx.beginPath();
            ctx.roundRect(30, 10, 8, 120, [16, 0, 0, 16]);
            ctx.fill();

            // Department name
            ctx.fillStyle = '#1a2b3c';
            ctx.font = 'bold 38px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(dept.name, 256, 52);

            // Points
            ctx.fillStyle = '#7b8fa0';
            ctx.font = '600 30px Inter, sans-serif';
            ctx.fillText(dept.points + ' pts', 256, 100);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(dept.x, topY + 10, dept.z);
            sprite.scale.set(26, 7, 1);
            scene.add(sprite);
        });

        // ── Click on buildings — using pointerdown/pointerup to not conflict with OrbitControls ──
        renderer.domElement.addEventListener('pointerdown', function(e) {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = Date.now();
        }, true);

        renderer.domElement.addEventListener('pointerup', function(e) {
            if (!pointerDownPos) return;
            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const elapsed = Date.now() - pointerDownTime;
            pointerDownPos = null;

            // Only treat as click if barely moved AND was a quick tap (not an orbit drag)
            if (dist > 8 || elapsed > 400) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            // Recursively test all children of every building group
            const intersects = raycaster.intersectObjects(buildingGroups, true);

            if (intersects.length > 0) {
                const deptId = getDeptIdFromHit(intersects[0].object);
                if (deptId) {
                    window.location.href = '/department/' + deptId + '/';
                }
            }
        }, true);

        // Change cursor on hover over buildings
        renderer.domElement.addEventListener('mousemove', function(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildingGroups, true);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'grab';
        });

        // Handle Window Resizing smoothly
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            if (container) {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        }

        // Main animation spin loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    });
</script>
{% endblock %}
